<!DOCTYPE html>
<html lang="en">
<head>
    <title>MapLibre GL JS Trusted Types page</title>
    <meta charset='utf-8'>
    <meta http-equiv="Content-Security-Policy" content="require-trusted-types-for 'script'; trusted-types app">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="about:blank">
    <link rel='stylesheet' href='../../../../dist/maplibre-gl.css' />
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>

<body>
<div id='map'></div>

<script type='module'>
import * as maplibregl from '../../../../dist/maplibre-gl-dev.mjs';

maplibregl.setWorkerUrl('../../../../dist/maplibre-gl-worker-dev.mjs');
maplibregl.setTrustedTypesPolicy(trustedTypes.createPolicy('app', {
    createHTML: (html) => html,
    createScriptURL: (url) => url
}));

window.map = new maplibregl.Map({
    container: 'map',
    zoom: 1,
    center: [0, 0],
    style: {
        version: 8,
        sources: {
            land: {
                type: 'geojson',
                data: `${location.origin}/test/integration/browser/fixtures/land.json`,
                attribution: '<a href="https://example.com">Land</a>'
            }
        },
        layers: [
            {
                id: 'land',
                type: 'fill',
                source: 'land',
                paint: {
                    'fill-color': '#f0e9e1'
                }
            }
        ]
    }
});
</script>

</body>
</html>
