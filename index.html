<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>importScriptInWorkers after the last map is removed</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.14.0/dist/maplibre-gl.css">
    <style>
        html, body { margin: 0; height: 100%; }
        body { display: flex; flex-direction: column; font: 13px sans-serif; }
        #bar { padding: 4px; }
        #maps { flex: 1; display: flex; gap: 2px; }
        #maps > div { flex: 1; }
    </style>
</head>
<body>
<div id="bar">
    <button id="recreate">Remove the map and create a new one</button>
    Left - 6.14.0 / Right - #8735
</div>
<div id="maps">
    <div id="before"></div>
    <div id="after"></div>
</div>
<script type="module">
    import * as release from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.14.0/dist/maplibre-gl.mjs';
    import * as pr from 'https://cdn.jsdelivr.net/gh/birkskyum/maplibre-gl-js@127b423bbab0452acad6940acbd0719b63564a8d/maplibre-gl.mjs';

    const workerScript = `
        self.addProtocol('demo', async (params) => {
            const response = await fetch(params.url.replace('demo://', 'https://'));
            return {data: await response.arrayBuffer()};
        });`;
    const workerScriptUrl = URL.createObjectURL(new Blob([workerScript]));

    const emptyStyle = {version: 8, sources: {}, layers: []};
    const style = {
        version: 8,
        sources: {
            countries: {type: 'vector', tiles: ['demo://demotiles.maplibre.org/tiles/{z}/{x}/{y}.pbf'], maxzoom: 6}
        },
        layers: [
            {id: 'background', type: 'background', paint: {'background-color': '#d8f2ff'}},
            {id: 'countries', type: 'fill', source: 'countries', 'source-layer': 'countries', paint: {'fill-color': '#9bd18b', 'fill-outline-color': '#555'}}
        ]
    };

    async function run(maplibregl, container) {
        let map = new maplibregl.Map({container, style: emptyStyle});
        await maplibregl.importScriptInWorkers(workerScriptUrl);
        map.setStyle(style);

        document.getElementById('recreate').addEventListener('click', () => {
            map.remove();
            map = new maplibregl.Map({container, style});
        });
    }

    run(release, 'before');
    run(pr, 'after');
</script>
</body>
</html>
