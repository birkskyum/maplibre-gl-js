<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>GeoJSON source with many points</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.19.0/dist/maplibre-gl.css">
    <style>
        html, body { margin: 0; height: 100%; }
        body { display: flex; flex-direction: column; font: 13px sans-serif; }
        #bar { padding: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        #map { flex: 1; }
    </style>
</head>
<body>
<div id="bar">
    <input id="count" type="range" min="0" max="5" value="2">
    <label><input id="cluster" type="checkbox"> Cluster</label>
    <button id="reset">Reset</button>
    6.19.0
    <span id="status"></span>
</div>
<div id="map"></div>
<script type="module">
    import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.19.0/dist/maplibre-gl.mjs';

    const COUNTS = [10_000, 50_000, 100_000, 250_000, 500_000, 1_000_000];
    const START = {center: [0, 20], zoom: 1.5};

    const slider = document.getElementById('count');
    const cluster = document.getElementById('cluster');
    const status = document.getElementById('status');

    const map = new maplibregl.Map({container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty', ...START});

    // The same points on every run and in both pages, spread over the world between 75° south and north.
    function createPoints(count) {
        let seed = 1;
        function random() {
            seed = (seed + 0x6D2B79F5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        }
        const features = [];
        for (let i = 0; i < count; i++) {
            features.push({type: 'Feature', properties: {}, geometry: {type: 'Point', coordinates: [random() * 360 - 180, random() * 150 - 75]}});
        }
        return {type: 'FeatureCollection', features};
    }

    let run = 0;

    // Replaces the source and shows how long the map takes from getting the data until everything is drawn.
    async function load() {
        const current = ++run;
        const count = COUNTS[Number(slider.value)];
        status.textContent = `${count.toLocaleString('en')} points, loading`;
        for (const id of ['count', 'clusters', 'points']) {
            if (map.getLayer(id)) map.removeLayer(id);
        }
        if (map.getSource('points')) map.removeSource('points');
        await new Promise(resolve => setTimeout(resolve, 50));
        if (current !== run) return;

        const data = createPoints(count);
        const start = performance.now();
        map.addSource('points', {type: 'geojson', data, cluster: cluster.checked, clusterRadius: 50});
        map.addLayer({id: 'points', type: 'circle', source: 'points', filter: ['!', ['has', 'point_count']], paint: {'circle-radius': 2, 'circle-color': '#d33', 'circle-opacity': 0.6}});
        map.addLayer({id: 'clusters', type: 'circle', source: 'points', filter: ['has', 'point_count'], paint: {'circle-radius': 16, 'circle-color': '#27a', 'circle-opacity': 0.8}});
        map.addLayer({id: 'count', type: 'symbol', source: 'points', filter: ['has', 'point_count'], layout: {'text-field': ['get', 'point_count_abbreviated'], 'text-font': ['Noto Sans Regular'], 'text-size': 11}, paint: {'text-color': '#fff'}});
        await map.once('idle');
        if (current !== run) return;
        status.textContent = `${count.toLocaleString('en')} points, drawn after ${((performance.now() - start) / 1000).toFixed(1)} s. Zoom and pan to load more tiles.`;
    }

    slider.addEventListener('change', load);
    cluster.addEventListener('change', load);
    document.getElementById('reset').addEventListener('click', () => {
        map.jumpTo(START);
        load();
    });
    map.once('load', load);
</script>
</body>
</html>
